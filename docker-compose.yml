services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=root
      - DB_NAME=e-website
    volumes:
      - .:/var/www/html
    depends_on:
      - db
  db:
    image: mariadb:10.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: e-website
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./e-website.sql:/docker-entrypoint-initdb.d/e-website.sql

volumes:
  db_data: